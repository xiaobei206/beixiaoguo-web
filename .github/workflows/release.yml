name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Read release version
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Check browser JavaScript syntax
        run: node --check internal/webui/assets/app.js
      - name: Check shell scripts
        run: |
          sh -n scripts/install-n1.sh
          sh -n scripts/beixiaoguo.init
          sh -n scripts/beixiaoguo-watchdog.sh
      - name: Build release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-amd64" ./cmd/beixiaoguo
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-arm64" ./cmd/beixiaoguo
          (cd dist && sha256sum "beixiaoguo-v$VERSION-linux-amd64" "beixiaoguo-v$VERSION-linux-arm64" > "beixiaoguo-v$VERSION-SHA256SUMS.txt")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 贝小果 v${{ steps.meta.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## 本次更新
            - 图片缓存升级为 224 MiB RAM 热缓存 + 最多 1 GiB 持久磁盘缓存，30 天 LRU 淘汰，服务重启后可复用。
            - 图片 CDN 短暂失败时优先返回已有旧封面；浏览器封面缓存延长至 7 天，减少重复下载。
            - 图片下载使用 8 路并发、64 个等待名额；相同图片请求合并，避免大量卡片同时下载时重复打源站。
            - 片库 API 使用 4 路并发、24 个有界等待名额；队列满返回 503 + Retry-After，前端自动重试一次，25 秒总截止时间仍覆盖排队与上游。
            - 目录 API RAM 缓存上限增加到 32 MiB；health 接口新增缓存占用、缓存上限和队列深度。
            - N1 默认持久图片缓存位置：/opt/beixiaoguo/cache/images，最多 1 GiB，不预分配，并保留至少 128 MiB 空闲空间；目录不可用或存储空间紧张时自动退回 RAM 缓存。
            - 保留 v0.1.11 的媒体 CDN Range 空响应检测和备用源切换，以及 v0.1.10 的过期列表请求取消。

            ## 下载
            - N1 / iStoreOS（ARM64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-arm64`
            - Linux x86_64（AMD64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-amd64`
            - SHA-256 校验文件：`beixiaoguo-v${{ steps.meta.outputs.version }}-SHA256SUMS.txt`

            自动化测试和交叉编译通过后发布。1 GiB 是持久图片缓存上限而非预分配；请在 N1 检查 /opt 所在分区可用空间。真实 N1 缓存恢复、磁盘淘汰和高并发压力仍需实机验收。
          files: |
            dist/*
