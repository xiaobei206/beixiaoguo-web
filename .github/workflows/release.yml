name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Read release version
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Check browser JavaScript syntax
        run: node --check internal/webui/assets/app.js
      - name: Check shell scripts
        run: |
          sh -n scripts/install-n1.sh
          sh -n scripts/beixiaoguo.init
          sh -n scripts/beixiaoguo-watchdog.sh
      - name: Build release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-amd64" ./cmd/beixiaoguo
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-arm64" ./cmd/beixiaoguo
          (cd dist && sha256sum "beixiaoguo-v$VERSION-linux-amd64" "beixiaoguo-v$VERSION-linux-arm64" > "beixiaoguo-v$VERSION-SHA256SUMS.txt")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 贝小果 v${{ steps.meta.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## 本次更新
            - 修复媒体 CDN 返回空/短 Range 正文但带有效 Content-Range 时，浏览器仍收到空 200/206：先核验响应长度并预读最多 64 KiB，异常源自动切换备用源。
            - 修复高频切换栏目/分页导致旧请求积压：前端取消过期列表 fetch，后端将 25 秒总超时覆盖到并发名额排队阶段，排队超时返回 504。
            - N1 / iStoreOS 新增 OpenWrt 原生 procd 服务：二进制安装在持久化的 /usr/bin/beixiaoguo，服务开机自启。
            - 服务进程异常退出后每隔 5 秒自动重试；加入本机健康检查守护，连续 3 次失败时请求 procd 重启应用实例。
            - 运行日志进入 OpenWrt 有界 RAM 日志缓冲，可用 `logread | grep -i beixiaoguo` 查看；缓存、会话和监控状态仍在 RAM，避免运行期间持续写入 TF 卡。
            - 一键更新器会迁移旧版 /tmp 中的程序、校验 SHA-256、预检服务脚本，并在健康检查失败时尝试回滚。
            - N1 同源封面图片代理与 RAM 缓存；页面切换恢复列表、分页游标和滚动位置。
            - 播放器支持最高 3 倍速、上下滑动切集、上一集/下一集和自动连播，及 N1 到 hongguoTV 的局域网发现与播放进度交接。
            - 发现、搜索、排行榜和新剧首次打开后逐页预载，目标至少 100 部；多季短剧详情页列出全部季；修复顶部搜索按钮窄屏下“搜索”竖排。

            ## 下载
            - N1 / iStoreOS（ARM64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-arm64`
            - Linux x86_64（AMD64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-amd64`
            - SHA-256 校验文件：`beixiaoguo-v${{ steps.meta.outputs.version }}-SHA256SUMS.txt`

            自动化测试和交叉编译通过；服务安装及健康检查脚本通过 shell 语法检查。真实 N1 重启持久化和手机 Tailscale 访问仍需实机验收。
          files: |
            dist/*
