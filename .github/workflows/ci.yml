name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Build Linux AMD64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/beixiaoguo-linux-amd64 ./cmd/beixiaoguo
      - name: Build Linux ARM64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/beixiaoguo-linux-arm64 ./cmd/beixiaoguo
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beixiaoguo-0.1.0-linux
          path: dist/*
