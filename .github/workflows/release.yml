name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Read release version
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Check browser JavaScript syntax
        run: node --check internal/webui/assets/app.js
      - name: Build release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-amd64" ./cmd/beixiaoguo
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-arm64" ./cmd/beixiaoguo
          (cd dist && sha256sum "beixiaoguo-v$VERSION-linux-amd64" "beixiaoguo-v$VERSION-linux-arm64" > "beixiaoguo-v$VERSION-SHA256SUMS.txt")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 贝小果 v${{ steps.meta.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## 本次更新
            - N1 同源封面图片代理与 RAM 缓存。
            - 页面切换时恢复列表、分页游标和滚动位置，目录数据增加有限 RAM 缓存。
            - 播放器支持最高 3 倍速、上下滑动切集、上一集/下一集和自动连播。
            - 增加 N1 到 hongguoTV 的局域网发现与播放进度交接。
            - mDNS 搜索按 PTR / SRV / TXT / A/AAAA 分阶段查询；图片代理安全跟随有限 CDN 重定向。
            - 修复 N1 更新器的 SHA-256 架构选择，只校验设备实际下载的二进制。
            - 发现、搜索、排行榜和新剧首次打开后主动逐页预载，目标至少 100 部；每页返回即追加显示，达到目标后按滚动位置续载；封面按可视区域懒加载。保留真实频道 / 类型 / 榜单 / 日期筛选 TAG 与分页状态标签。
            - 多季短剧详情页通过 SDK Seasons 接口列出全部季；当前季高亮，已上线季可点击切换，未上线季置灰。
            - 修复顶部搜索按钮在窄屏被 Flex 压缩后“搜索”竖排；按钮固定宽度、强制横排，输入框负责弹性收缩。

            ## 下载
            - N1 / iStoreOS（ARM64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-arm64`
            - Linux x86_64（AMD64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-amd64`
            - SHA-256 校验文件：`beixiaoguo-v${{ steps.meta.outputs.version }}-SHA256SUMS.txt`

            自动化测试和交叉编译通过；真实 N1、手机图片 CDN 与电视端接力仍需实机验收。
          files: |
            dist/*
