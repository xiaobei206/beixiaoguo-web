name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Read release version
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Check browser JavaScript syntax
        run: node --check internal/webui/assets/app.js
      - name: Smoke-test browser startup and settings
        run: node scripts/check-ui-startup.mjs
      - name: Check shell scripts
        run: |
          sh -n scripts/install-n1.sh
          sh -n scripts/beixiaoguo.init
          sh -n scripts/beixiaoguo-watchdog.sh
      - name: Build release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-amd64" ./cmd/beixiaoguo
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-arm64" ./cmd/beixiaoguo
          (cd dist && sha256sum "beixiaoguo-v$VERSION-linux-amd64" "beixiaoguo-v$VERSION-linux-arm64" > "beixiaoguo-v$VERSION-SHA256SUMS.txt")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 贝小果 v${{ steps.meta.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ## 本次更新
            - 保留按住视频画面临时 2× 加速，松手恢复用户倍速设置；移除画面常驻手势说明、长按时的文字遮罩和工具栏额外按钮，避免遮挡观影。\n            - 修复上/下滑切集回归：移动手指取消长按计时后，仍会按滑动方向切换剧集。
            - 新增 PWA manifest 与 192/512 图标；首页“添加到桌面”按钮会触发可用的原生安装提示，或展示 iOS/浏览器分平台操作步骤。
            - 检测到原生画中画时，网页内显示辅助按住倍速按钮；原生 PiP 小窗不支持网页嵌入自定义 HTML 控件。
            - iOS 主屏幕独立 Web App 可隐藏 Safari 地址栏和底部工具栏；系统状态栏/滑动手势仍由 iOS 控制。
            - 网页全屏支持按钮与 Esc 退出，详情弹窗不会因 Esc 意外关闭；调整手机安全区和横屏短视口布局，并尽可能隐藏视频原生全屏按钮。
            - 修复部分作品详情偶发请求失败：合并作品详情和分集目录为单次 SDK 请求，避免重复并发打到同一个上游接口；失败时提供重试入口。
            - 修复前端初始化中断：设置按钮恢复可用，首页首次打开自动加载推荐列表；新增浏览器启动冒烟测试。
            - 新增右上角“缓存与智能预热”设置页，参数保存到 /opt/beixiaoguo/settings.json，保存后立即生效，无需重新编译或重启。
            - 图片 RAM 默认 224 MiB，闪存默认 4 GiB；RAM 按 7 天闲置淘汰，闪存按 90 天闲置保留并 LRU 淘汰，至少保留 1 GiB 系统剩余空间。
            - 移除图片 RAM 12 小时强制过期；RAM 命中不再反复读取闪存，闪存命中不重复写文件。
            - API RAM 缓存默认 64 MiB / 4096 条；目录、详情、分集缓存有效期延长，刷新失败时继续提供旧列表作为备用。
            - 不建立永久剧情数据库；文字数据只保存在 RAM，服务重启后由启动预热重新获取。
            - 开机及每小时整点预热推荐、真人剧、漫剧、找剧、电影、小说、排行榜、当日新剧各目标 100 条，并预热热搜。
            - 后台 API 1 工作槽、每次 10 秒超时、至少 1.2 秒间隔；封面后台最多 2 路、每次 15 秒超时。超时单项跳过，不阻塞其他频道。
            - 浏览器播放心跳及 N1 媒体流检测播放活动；播放期间暂停预热，空闲 3 分钟后恢复。前台请求优先，后台 API 只使用一个上游槽位。
            - 设置页显示缓存占用、预热进度、失败数量和下次执行时间，可手动触发预热；无账号认证，按家庭局域网使用。

            ## 下载
            - N1 / iStoreOS（ARM64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-arm64`
            - Linux x86_64（AMD64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-amd64`
            - SHA-256 校验文件：`beixiaoguo-v${{ steps.meta.outputs.version }}-SHA256SUMS.txt`

            自动化测试、JavaScript/Shell 语法检查和 ARM64/AMD64 交叉编译通过后发布。图片和预热参数均为运行时设置；真实 N1 启动预热、播放抢占和持续运行仍需实机验收。
          files: |
            dist/*
