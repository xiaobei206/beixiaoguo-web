name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Read release version
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve modules
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Check browser JavaScript syntax
        run: node --check internal/webui/assets/app.js
      - name: Smoke-test browser startup and settings
        run: node scripts/check-ui-startup.mjs
      - name: Check shell scripts
        run: |
          sh -n scripts/install-n1.sh
          sh -n scripts/beixiaoguo.init
          sh -n scripts/beixiaoguo-watchdog.sh
      - name: Build release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-amd64" ./cmd/beixiaoguo
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/beixiaoguo-v$VERSION-linux-arm64" ./cmd/beixiaoguo
          (cd dist && sha256sum "beixiaoguo-v$VERSION-linux-amd64" "beixiaoguo-v$VERSION-linux-arm64" > "beixiaoguo-v$VERSION-SHA256SUMS.txt")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: 贝小果 v${{ steps.meta.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ## 本次更新
            - 新增 iOS / Safari Media Session 锁屏媒体信息：显示当前短剧封面、短剧名称和集数。
            - 锁屏支持播放、暂停、上一集、下一集及进度跳转，直接控制当前网页视频和分集播放流程。
            - 播放状态和进度实时同步；切集更新锁屏信息，关闭播放器后清理旧媒体信息。
            - 封面通过 N1 同源图片代理读取，不将上游签名 URL 或媒体密钥暴露给浏览器。
            - 保留 v0.1.20 的独立 PiP 入口及 iOS standalone 能力提示。
            ## 下载
            - N1 / iStoreOS（ARM64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-arm64`
            - Linux x86_64（AMD64）：`beixiaoguo-v${{ steps.meta.outputs.version }}-linux-amd64`
            - SHA-256 校验文件：`beixiaoguo-v${{ steps.meta.outputs.version }}-SHA256SUMS.txt`

            自动化测试、JavaScript/Shell 语法检查和 ARM64/AMD64 交叉编译通过后发布。图片和预热参数均为运行时设置；真实 N1 启动预热、播放抢占和持续运行仍需实机验收。
          files: |
            dist/*
